<body data-layout="tool" data-category="Text">

<main>
  <section class="hero">
    <div class="container">
      <span class="hero-badge"><span class="dot"></span>100% client-side &middot; zero data retention</span>
      <h1>Text Tools</h1>
      <p class="sub">Format, convert, analyze and manipulate text documents &mdash; entirely in your browser, nothing is ever uploaded.</p>

      <div class="toolbar">
        <label class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="searchInput" placeholder="Search Text Tools&hellip;" autocomplete="off">
        </label>
        <div class="filters" id="filterRow"></div>
      </div>

      <p class="count" id="toolCount" aria-live="polite"></p>
      <div class="tool-grid" id="toolGrid"></div>
      <div class="empty" id="emptyState">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h3>No utilities match your search</h3>
        <p>Try a different keyword or clear the filters.</p>
        <button class="btn btn-ghost btn-sm" type="button">Clear filters</button>
      </div>
    </div>
  </section>
</main>
