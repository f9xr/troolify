<body data-layout="tool">

<main class="tool-main">
  <div class="container">
    <div class="tool-head">
      <span class="tool-badge"><span class="dot"></span>100% client-side &middot; zero data retention</span>
      <h1>Word Counter</h1>
      <p>Live word, character, sentence and reading-time stats as you type &mdash; computed in this tab, never sent anywhere.</p>
      <div class="tool-meta">
        <span class="tool-tag"><i class="fa-solid fa-tag"></i>Text</span>
        <span class="tool-cat"><i class="fa-solid fa-folder"></i>Text Tools</span>
      </div>
    </div>

    <div class="panel">
      <textarea id="wcInput" aria-label="Text to analyze" placeholder="Paste or type anything &mdash; the stats update instantly, right here in your browser&hellip;"></textarea>
      <div class="stats-grid">
        <div class="stat"><b id="wcWords">0</b><span>Words</span></div>
        <div class="stat"><b id="wcChars">0</b><span>Characters</span></div>
        <div class="stat"><b id="wcSent">0</b><span>Sentences</span></div>
        <div class="stat"><b id="wcRead">0 min</b><span>Read time</span></div>
      </div>
      <div class="actions">
        <button class="rt-btn" type="button" data-action="upper"><i class="fa-solid fa-font"></i>UPPERCASE</button>
        <button class="rt-btn" type="button" data-action="lower"><i class="fa-solid fa-font"></i>lowercase</button>
        <button class="rt-btn" type="button" data-action="title"><i class="fa-solid fa-font"></i>Title Case</button>
        <button class="rt-btn" type="button" data-action="copy"><i class="fa-solid fa-copy"></i>Copy</button>
        <button class="rt-btn" type="button" data-action="clear"><i class="fa-solid fa-rotate-left"></i>Clear</button>
      </div>
      <p class="proc-line"><i class="fa-solid fa-bolt"></i><span id="wcProc">Ready &mdash; processing happens in this tab.</span></p>
    </div>
  </div>
</main>

<script src="../../assets/js/layout.js" defer></script>
<script>
(function(){
  "use strict";

  var input = document.getElementById("wcInput");
  var elWords = document.getElementById("wcWords");
  var elChars = document.getElementById("wcChars");
  var elSent = document.getElementById("wcSent");
  var elRead = document.getElementById("wcRead");
  var elProc = document.getElementById("wcProc");

  function analyze(){
    var t0 = performance.now();
    var text = input.value;
    var words = text.trim() === "" ? 0 : text.trim().split(/\s+/).filter(function(w){ return w.length > 0; }).length;
    var chars = text.replace(/\s+/g, "").length;
    var total = text.length;
    var sentences = text.split(/[.!?]+/).filter(function(s){ return s.trim().length > 0; }).length;
    var mins = Math.max(1, Math.ceil(words / 200));
    elWords.textContent = words;
    elChars.textContent = total + " / " + chars;
    elSent.textContent = sentences;
    elRead.textContent = words === 0 ? "0 min" : mins + " min";
    elProc.textContent = "Processed in " + (performance.now() - t0).toFixed(1) + " ms — inside your browser. 0 bytes uploaded.";
  }

  input.addEventListener("input", analyze);

  document.querySelectorAll("[data-action]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var action = btn.getAttribute("data-action");
      var v = input.value;
      if (action === "upper") v = v.toUpperCase();
      else if (action === "lower") v = v.toLowerCase();
      else if (action === "title") v = v.replace(/\b\w/g, function(c){ return c.toUpperCase(); });
      else if (action === "clear") v = "";
      else if (action === "copy") {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(v).then(done, done);
        } else {
          var ta = document.createElement("textarea");
          ta.value = v;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); } catch (e) {}
          document.body.removeChild(ta);
          done();
        }
        return;
      }
      input.value = v;
      analyze();
      function done(){ elProc.textContent = "Copied to clipboard — the bytes never left your device."; }
    });
  });

  analyze();
})();
</script>
</body>
