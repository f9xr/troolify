<body data-layout="tool">

<main class="tool-main">
  <div class="container">
    <div class="tool-head">
      <span class="tool-badge"><span class="dot"></span>100% client-side &middot; zero data retention</span>
      <h1>JSON Formatter</h1>
      <p>Format, validate, minify and copy JSON instantly &mdash; processed in this tab, never sent to any server.</p>
      <div class="tool-meta">
        <span class="tool-tag"><i class="fa-solid fa-tag"></i>JSON</span>
        <span class="tool-cat"><i class="fa-solid fa-folder"></i>Developer Tools</span>
      </div>
    </div>

    <div class="panel">
      <textarea id="jsonInput" spellcheck="false" aria-label="JSON to format" placeholder='{"name":"Troolify","local":true,"utilities":["converters","text","crypto"]}'></textarea>
      <div class="actions">
        <button class="btn btn-primary" type="button" id="jsonFormat"><i class="fa-solid fa-code"></i>Format</button>
        <button class="rt-btn" type="button" id="jsonMinify"><i class="fa-solid fa-compress"></i>Minify</button>
        <button class="rt-btn" type="button" id="jsonCopy"><i class="fa-solid fa-copy"></i>Copy output</button>
      </div>
      <pre class="output" id="jsonOutput" aria-live="polite"></pre>
      <p class="status" id="jsonStatus"></p>
      <p class="proc-line"><i class="fa-solid fa-bolt"></i><span id="jsonProc">Validated instantly in your browser &mdash; never sent anywhere.</span></p>
    </div>
  </div>
</main>

<script src="../../assets/js/layout.js" defer></script>
<script>
(function(){
  "use strict";

  var input = document.getElementById("jsonInput");
  var output = document.getElementById("jsonOutput");
  var status = document.getElementById("jsonStatus");
  var proc = document.getElementById("jsonProc");

  function parseJson(){
    if (input.value.trim() === "") {
      output.classList.remove("visible");
      output.textContent = "";
      status.textContent = "";
      status.className = "status";
      return null;
    }
    try {
      var obj = JSON.parse(input.value);
      status.textContent = "Valid JSON — " + JSON.stringify(obj).length + " bytes parsed locally.";
      status.className = "status ok";
      return obj;
    } catch (err) {
      status.textContent = "Invalid JSON: " + err.message;
      status.className = "status err";
      return null;
    }
  }

  function render(obj, minified){
    var t0 = performance.now();
    output.textContent = minified ? JSON.stringify(obj) : JSON.stringify(obj, null, 2);
    output.classList.add("visible");
    proc.textContent = "Processed in " + (performance.now() - t0).toFixed(1) + " ms — in this tab, never sent anywhere.";
  }

  input.addEventListener("input", function(){
    var t0 = performance.now();
    var obj = parseJson();
    if (obj) render(obj, false);
    proc.textContent = "Validated in " + (performance.now() - t0).toFixed(1) + " ms — in this tab, never sent anywhere.";
  });

  document.getElementById("jsonFormat").addEventListener("click", function(){
    var obj = parseJson();
    if (obj) render(obj, false);
  });

  document.getElementById("jsonMinify").addEventListener("click", function(){
    var obj = parseJson();
    if (obj) render(obj, true);
  });

  document.getElementById("jsonCopy").addEventListener("click", function(){
    var txt = output.textContent;
    if (!txt) return;
    function done(){ status.textContent = "Output copied to clipboard."; status.className = "status ok"; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });
})();
</script>
</body>
